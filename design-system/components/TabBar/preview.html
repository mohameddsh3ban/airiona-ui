<div id="root" class="ar ar-stage" style=""></div>

  h('div', { className: 'm-demo is-canvas', style: { height: 110 } }, h(A.TabBar, { variant: 'pill', items: [{ value: 'home', label: 'Home', icon: 'home' }, { value: 'trips', label: 'Trips', icon: 'ticket' }, { value: 'saved', label: 'Saved', icon: 'heart' }, { value: 'me', label: 'Profile', icon: 'user' }] }))));
