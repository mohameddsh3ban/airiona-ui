<!-- Sign in: generated from docs/pages/login/page.spec.json -->
<main class="ar pg">
  <section class="pg-s pg-s--auth" aria-label="Sign in">
    <form class="pg-g" [formGroup]="login" (ngSubmit)="submitLogin()" novalidate>
        <ar-auth-shell
          class="pg-el-shell"
          headline="Your aircraft, your schedule."
          [highlights]="shellHighlights"
          side="left"
          mediaLabel="About Airiona"
          poster="assets/photos/aviation/auth-wing.webp"
          video="assets/video/auth-wing.mp4"
          stripImage="assets/photos/aviation/auth-wing-strip.webp"
        >
          <button
            arButton
            arActions
            class="pg-el-help"
            variant="ghost"
            size="sm"
            iconStart="question-mark-circle"
            (click)="openHelp($event)"
          >Help</button>
          <a arFoot class="ar-auth-link pg-el-privacy" href="#/legal/privacy">Privacy</a>
          <div class="ar-auth-head pg-el-head">
            <h1 class="pg-el-title">Welcome back</h1>
            <p class="pg-el-lede">Sign in to book flights, follow your listings and manage hangar space.</p>
          </div>
          <ar-text-field
            class="pg-el-email"
            type="email"
            autocomplete="email"
            inputMode="email"
            iconStart="envelope"
            [placeholder]="emailPlaceholder"
            label="Email"
            formControlName="email"
            [error]="loginForm.error('email')"
          />
          <ar-text-field
            class="pg-el-password"
            type="password"
            autocomplete="current-password"
            iconStart="lock-closed"
            label="Password"
            formControlName="password"
            [error]="loginForm.error('password')"
          />
          <div class="ar-auth-row pg-el-options">
            <ar-checkbox class="pg-el-remember" label="Keep me signed in" formControlName="remember" />
            @if (loginForm.error('remember'); as message) {
              <p class="pg-error" role="alert">{{ message }}</p>
            }
            <a class="ar-auth-link pg-el-forgot" href="#/forgot-password">Forgot password?</a>
          </div>
          <button
            arButton
            class="pg-el-submit"
            variant="primary"
            size="lg"
            [block]="true"
            type="submit"
            [loading]="loginForm.pending()"
          >Sign in</button>
          <p class="ar-auth-divider pg-el-or">or</p>
          <button
            arButton
            class="pg-el-passkey"
            variant="secondary"
            size="lg"
            [block]="true"
            iconStart="finger-print"
            type="button"
            (click)="signInWithPasskey($event)"
          >Continue with passkey</button>
          <p class="ar-auth-switch pg-el-switch">New to Airiona? 
            <a class="ar-auth-link pg-el-signupLink" href="#/signup">Create an account</a>
          </p>
        </ar-auth-shell>
    </form>
  </section>
</main>
